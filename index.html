<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impala42</title>
<script defer src="https://cloud.umami.is/script.js" data-website-id="ad4a8bfc-f45f-490e-9ff8-3f5ae9b3b530"></script>
<style>
  :root {
    --bg: #fafafa;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e0e0e0;
    --accent: #1a1a1a;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  main {
    width: 100%;
    max-width: 560px;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 0.25rem 0;
  }

  h1 a {
    color: var(--text);
    text-decoration: none;
  }

  h1 a:hover,
  h1 a:focus-visible {
    text-decoration: underline;
    text-underline-offset: 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 2.5rem 0;
  }

  h2 {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 1rem 0;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--line);
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }


  li:last-child {
    border-bottom: none;
  }

  li a {
    display: block;
    padding: 0.42rem 0;
    color: var(--text);
    text-decoration: none;
    transition: opacity 0.15s ease;
  }

  li a:hover,
  li a:focus-visible {
    opacity: 0.6;
  }

  li a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }


  @media (prefers-reduced-motion: reduce) {
    li a {
      transition: none;
    }
  }
</style>
</head>
<body>
  <main>
    <h1><a href="https://github.com/impala42" target="_blank" rel="noopener">Impala42</a></h1>
    <p class="subtitle">github.com/impala42</p>

    <h2>Naviguer</h2>
    <ul>
      <li>
        <a href="https://impala42.github.io/praise-panel/">
          PraisePanel - Application de vidéoprojection de chants en ligne
        </a>
      </li>
      <li>
        <a href="https://lyceerudloff.com/simubac/">
          Simubac - Lycée Rudloff
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
